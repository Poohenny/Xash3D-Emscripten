<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <link rel="shortcut icon" type="image/x-icon" href="favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="MobileOptimized" content="640"/>
    <meta name="HandheldFriendly" content="true"/>
    <title>Xash3D Interactive Embed</title>
    
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #333333;
            color: #f0b418;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #game-container {
            width: 100%;
            max-width: 800px; /* Adjust this to fit your site's embed width */
            text-align: center;
            margin-top: 15px;
        }

        canvas.emscripten {
            border: 2px solid #f0b418;
            background-color: black;
            display: none;
            width: 100%;
            box-sizing: border-box;
        }

        #status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            width: 100%;
        }

        #status {
            font-weight: bold;
            text-align: left;
        }

        #progress-container {
            flex-grow: 1;
            height: 20px;
            border: 2px solid #f0b418;
            margin-left: 15px;
            display: none;
            background-color: #555;
        }

        #progress-bar {
            height: 100%;
            background-color: #f0b418;
            width: 0%;
            text-align: center;
            color: #333;
            font-size: 14px;
            font-weight: bold;
            line-height: 20px;
        }

        .loader {
            border: 4px solid #555;
            border-top: 4px solid #f0b418;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #controls {
            margin: 10px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
        }

        #output {
            width: 100%;
            height: 150px;
            background-color: black;
            color: white;
            border: 1px solid #f0b418;
            font-family: 'Lucida Console', Monaco, monospace;
            padding: 8px;
            box-sizing: border-box;
            resize: vertical;
            outline: none;
            margin-top: 10px;
        }

        button.action-btn {
            background-color: #f0b418;
            color: #000;
            border: none;
            padding: 5px 15px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 3px;
        }
        
        button.action-btn:hover {
            background-color: #ffa600;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="status-bar">
            <div id="status">Downloading...</div>
            <div id="progress-container">
                <div id="progress-bar">0%</div>
            </div>
        </div>

        <div class="loader" id="loader"></div>

        <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()"></canvas>

        <div id="controls" style="display: none;">
            <div>
                <label><input type="checkbox" id="resize"> Resize canvas</label>
                &nbsp;&nbsp;
                <label><input type="checkbox" id="pointerLock" checked> Lock/hide mouse</label>
            </div>
            <button class="action-btn" onclick="Module.requestFullscreen(document.getElementById('pointerLock').checked, document.getElementById('resize').checked)">Fullscreen</button>
        </div>

        <textarea id="output" readonly></textarea>
    </div>

    <!-- Required Scripts -->
    <script src="browserfs.min.js"></script>
    <script>
        var zipMods = [];
        var pkgMods = [];
    </script>
    <script src="mods.js"></script>

    <script>
        // DOM Elements
        const statusElement = document.getElementById('status');
        const progressContainer = document.getElementById('progress-container');
        const progressBar = document.getElementById('progress-bar');
        const canvasElement = document.getElementById('canvas');
        const loaderElement = document.getElementById('loader');
        const controlsElement = document.getElementById('controls');
        const outputElement = document.getElementById('output');

        var mounted = false;
        var gamedir = 'valve';
        var moduleCount = 0;
        var mfs;
        var savedRun;
        
        // Memory Configuration
        var mem = 150;
        try { if(window.location.hash) mem = Math.round(window.location.hash.substring(1)); } catch(e) {}

        // Polyfill for BrowserFS on older browsers
        if (!ArrayBuffer.isView) {
            ArrayBuffer.isView = function(a) { 
                return a !== null && typeof(a) === "object" && a['buffer'] instanceof ArrayBuffer; 
            };
        }

        function showElement(el, show) { 
            if (el) el.style.display = show ? (el.id === 'progress-container' || el.id === 'controls' ? 'flex' : 'block') : 'none'; 
        }

        // Emscripten Module Setup
        var Module = {
            TOTAL_MEMORY: mem * 1024 * 1024,
            preRun: [],
            postRun: [],
            print: function(text) {
                if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
                if (outputElement) {
                    outputElement.value += text + '\n';
                    outputElement.scrollTop = outputElement.scrollHeight;
                }
            },
            printErr: function(text) {
                if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
                Module.print("[ERR] " + text);
            },
            canvas: (function() {
                canvasElement.addEventListener("webglcontextlost", function(e) { 
                    alert('WebGL context lost. You will need to reload the page.'); 
                    e.preventDefault(); 
                }, false);
                return canvasElement;
            })(),
            setStatus: function(text) {
                if (!Module.setStatus.last) Module.setStatus.last = { time: Date.now(), text: '' };
                if (text === Module.setStatus.text) return;
                
                statusElement.innerHTML = text;
                var m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
                
                if (m) {
                    var progress = Math.round(parseInt(m[2]) * 100 / parseInt(m[4]));
                    progressBar.style.width = progress + '%';
                    progressBar.innerHTML = progress + '%';
                    showElement(progressContainer, true);
                } else {
                    showElement(progressContainer, false);
                }
            },
            totalDependencies: 0,
            monitorRunDependencies: function(left) {
                this.totalDependencies = Math.max(this.totalDependencies, left);
                if (left) Module.setStatus('Preparing... (' + (this.totalDependencies - left) + '/' + this.totalDependencies + ')');
            }
        };

        window.onerror = function(event) {
            if (mounted) FS.syncfs(false, function(err){ Module.print('Saving FS: ' + err); });
            if (String(event).indexOf('SimulateInfiniteLoop') > -1) return;
            Module.setStatus('Exception thrown: ' + event);
        };

        function haltRun() {}

        // Automatically start the initialization sequence
        function autoStartInit() {
            savedRun = run;
            Module.run = haltRun;
            run = haltRun;

            Module.setStatus("Downloading engine scripts...");
            ENV.XASH3D_GAMEDIR = gamedir;
            ENV.XASH3D_RODIR = '/rodir';

            function loadModule(name) {
                var script = document.createElement('script');
                script.onload = function() {
                    moduleCount++;
                    if (moduleCount === 3) {
                        Module.setStatus("Scripts downloaded! Starting game...");
                        launchGameSequence();
                    }
                };
                document.body.appendChild(script);
                script.src = name + ".js";
            }

            loadModule("server");
            loadModule("client");
            loadModule("menu");
        }

        // Triggered automatically once engine scripts are loaded
        function launchGameSequence() {
            showElement(loaderElement, false);
            setupFS();
            
            // Hardcoded Options
            Module.arguments = ['+map', 'cs_eleven']; 
            Module.run = run = savedRun;
            
            // Fetch ZIP data automatically (defaulting to the first mod in mods.js)
            var zipUrl = (typeof zipMods !== 'undefined' && zipMods.length > 0) ? zipMods[0][0] : 'game.zip';
            fetchZIP(zipUrl, savedRun);
            
            showElement(canvasElement, true);
            showElement(controlsElement, true);

            window.addEventListener("beforeunload", function (e) {
                var msg = 'Leave the game?';
                (e || window.event).returnValue = msg;
                return msg;
            });
        }

        function mountZIP(data) {
            var Buffer = BrowserFS.BFSRequire('buffer').Buffer;
            mfs.mount('/zip', new BrowserFS.FileSystem.ZipFS(Buffer.from(data)));
            FS.mount(new BrowserFS.EmscriptenFS(), {root:'/zip'}, '/rodir');
        }

        function fetchZIP(packageName, cb) {
            var xhr = new XMLHttpRequest();
            xhr.open('GET', packageName, true);
            xhr.responseType = 'arraybuffer';

            xhr.onprogress = function(event) {
                var size = event.total;
                if (!size && typeof zipMods !== 'undefined' && zipMods.length > 0) size = zipMods[0][2];
                
                if (event.loaded) {
                    Module.setStatus('Downloading game data... (' + event.loaded + '/' + (size || '???') + ')');
                } else {
                    Module.setStatus('Downloading game data...');
                }
            };
            
            xhr.onerror = function() { throw new Error("NetworkError fetching ZIP"); };
            
            xhr.onload = function() {
                if (xhr.status === 200 || xhr.status === 304 || xhr.status === 206 || (xhr.status === 0 && xhr.response)) {
                    Module.setStatus('Mounting filesystem...');
                    mountZIP(xhr.response);
                    Module.setStatus('Ready!');
                    cb();
                } else {
                    throw new Error(xhr.statusText + " : " + xhr.responseURL);
                }
            };
            xhr.send(null);
        }

        function setupFS() {
            FS.mkdir('/rodir');
            FS.mkdir('/xash');
            try {
                mfs = new BrowserFS.FileSystem.MountableFileSystem();
                BrowserFS.initialize(mfs);
            } catch(e) {
                mfs = undefined;
                Module.print('Failed to initialize BrowserFS: ' + e);
            }

            // Hardcoded to LocalStorage file system logic
            if (mfs) {
                mfs.mount('/ls', new BrowserFS.FileSystem.LocalStorage());
                FS.mount(new BrowserFS.EmscriptenFS(), {root:'/ls'}, '/xash');
                Module.print('LocalStorage automatically mounted as game data source.');
            }
            FS.chdir('/xash/');
        }

        Module.preInit = [autoStartInit];
        Module.websocket = [];
        Module.websocket.url = 'wsproxy://the-swank.pp.ua:3000/';
        var ENV = [];
    </script>

    <script>
        // Start downloading the memory initializer and standard xash.js immediately
        (function() {
            var memoryInitializer = 'xash.html.mem';
            if (typeof Module['locateFile'] === 'function') {
                memoryInitializer = Module['locateFile'](memoryInitializer);
            } else if (Module['memoryInitializerPrefixURL']) {
                memoryInitializer = Module['memoryInitializerPrefixURL'] + memoryInitializer;
            }
            var xhr = Module['memoryInitializerRequest'] = new XMLHttpRequest();
            xhr.open('GET', memoryInitializer, true);
            xhr.responseType = 'arraybuffer';
            xhr.send(null);
        })();

        var script = document.createElement('script');
        script.src = "xash.js";
        document.body.appendChild(script);
    </script>
</body>
</html>
